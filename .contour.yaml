# contour project config
#
# Per-project settings, at the project root so they are independent of which
# overlay folder (.contour/, .agents/ or .claude/) holds your local rules —
# move those between folders freely without losing this. Commit it so your
# team shares the setup.

# bootstrap: the central store profiles whose rules load eagerly here.
#   List more than one to combine entry points — [python, cli] for a Python
#   project that also ships a CLI. They compose in order, and an item both
#   profiles select is loaded once. A bare name works too: bootstrap: python
#   The --bootstrap flag to `contour mcp` overrides this.
bootstrap: [dart]

# eager_files: files loaded eagerly as project rules, paths relative to the
#   project root. Keep a CLAUDE.md or AGENTS.md without moving it into rules/.
eager_files: []
