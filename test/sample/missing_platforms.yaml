name: your_project
version: 0.0.1+0000001

build_pipe:
  workflows:
    default:
      clean_flutter: true
      generate_log: true
      output: auto
      pre_platform_run:
        build: "sh ./pre-build.sh"
      post_platform_run:
        build:
          on_success: "sh ./post-build.sh"
      xcode_derived_data_path_env_key: PATH_TO_XCODE_DERIVED # the env variable key
    with_empty_build:
      clean_flutter: true
      generate_log: true
      output: auto
      pre_platform_run:
        build: "sh ./pre-build.sh"
      post_platform_run:
        build:
          on_success: "sh ./post-build.sh"
      xcode_derived_data_path_env_key: PATH_TO_XCODE_DERIVED # the env variable key
      platforms:
        android:
          build:
            build_command: ""